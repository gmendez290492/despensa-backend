[project]
name = "despensa-backend"
version = "0.1.0"
description = "Backend orientado a eventos para control de despensa, alertas de caducidad y recetas sugeridas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "httpx>=0.27.2",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (orden de imports)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (sintaxis moderna Python 3.12)
    "S",      # flake8-bandit (reglas básicas de seguridad)
    "ASYNC",  # buenas prácticas async
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # Permitir 'assert' en pruebas con pytest

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aio_pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
